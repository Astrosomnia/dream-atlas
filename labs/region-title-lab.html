<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Region Title Lab</title>
<style>
:root{--text:#ece8f2;--mist:#a9a3b8;--faint:#6f6a80;--gold:#ecd7a2;--f-mono:"SF Mono",Menlo,Consolas,monospace;--f-ui:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--f-display:Georgia,"Times New Roman",serif}
html,body{margin:0;height:100%;background:#04050b;color:var(--text);font-family:var(--f-ui);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--f-mono);text-transform:uppercase;text-align:center}
.lbl .name span{display:inline-block;opacity:0;transition:opacity .5s ease}
.lbl .name span.on{opacity:1}
.lbl .n{opacity:0;transition:opacity 1s ease;margin-left:.6em}
.lbl .rule{position:absolute;left:50%;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(236,215,162,.75) 30%,rgba(236,215,162,.75) 70%,transparent);opacity:0;transition:opacity 1.2s ease,width 1.6s cubic-bezier(.2,.7,.2,1);width:0}
.lbl .band{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:58px;background:radial-gradient(ellipse at center,rgba(4,5,11,.65),rgba(4,5,11,.35) 45%,transparent 72%);opacity:0;transition:opacity 1.2s ease;width:0}
.hud{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:5}
.hud button{height:34px;padding:0 13px;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:rgba(14,16,30,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--mist);font:12px var(--f-ui)}
.hud button[aria-pressed="true"]{color:#17140c;background:var(--gold);border-color:var(--gold)}
.hud .play{color:var(--gold);border-color:rgba(236,215,162,.5)}
.title{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));font:italic 20px var(--f-display);color:var(--text);z-index:5}
.title small{display:block;font:9.5px var(--f-mono);letter-spacing:.14em;color:var(--faint);margin-top:4px;font-style:normal;text-transform:uppercase}
</style></head><body>
<canvas id="c"></canvas><div id="labels"></div>
<div class="title">Region title lab<small>Tap the sky to skip · switches below</small></div>
<div class="hud">
  <button class="play" id="one">▶ One region</button>
  <button class="play" id="three">▶ Three regions</button>
  <button id="carto" aria-pressed="true">Cartographic</button>
  <button id="queue" aria-pressed="true">Queued</button>
  <button id="speed">Speed 1×</button>
</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d'), L = document.getElementById('labels');
let W, H, DPR = Math.min(2, devicePixelRatio || 1);
function size(){ W = innerWidth; H = innerHeight; c.width = W*DPR; c.height = H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', size); size();
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const field = Array.from({length: 260}, () => ({ x: rnd(), y: rnd(), r: rnd()*1.1 + .2, a: rnd()*.6 + .15, tw: rnd()*6 }));
// existing regions, already settled
const settled = [
  { x:.24, y:.30, col:[90,130,200], name:'WATER', n:8 },
  { x:.72, y:.42, col:[140,90,160], name:'BEING CHASED', n:5 },
  { x:.38, y:.78, col:[70,150,140], name:'HOUSES WITH EXTRA ROOMS', n:6 },
];
const SPAWNS = [
  { x:.62, y:.20, col:[120,150,230], name:'DROWNING', n:3 },
  { x:.20, y:.58, col:[200,150,110], name:'CRYING', n:3 },
  { x:.80, y:.70, col:[170,120,200], name:'NAKEDNESS', n:3 },
];
let live = [], speed = 1, carto = true, queued = true, timers = [];
const ease = t => 1 - Math.pow(1 - t, 3);
function blob(x, y, col, r, a){
  for (let k = 0; k < 3; k++) {
    const rr = r * (1 - k*.22), gr = g.createRadialGradient(x + k*7, y - k*5, 0, x, y, rr);
    gr.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${a*(0.55 - k*.12)})`);
    gr.addColorStop(.5, `rgba(${col[0]*.6|0},${col[1]*.6|0},${col[2]*.8|0},${a*(0.22 - k*.05)})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
  }
}
function star(x, y, r, a, col = [255,255,255]){
  const gr = g.createRadialGradient(x, y, 0, x, y, r*5); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(.25, `rgba(${col},${a*.35})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r*5, 0, 7); g.fill();
  g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
function makeLabel(s, settledNow){
  const el = document.createElement('div'); el.className = 'lbl';
  el.innerHTML = `<div class="band"></div><div class="rule" style="top:-10px"></div><span class="name">${[...s.name].map(ch => `<span>${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</span><span class="n">${s.n}</span><div class="rule" style="bottom:-10px"></div>`;
  L.appendChild(el); s.el = el; place(s);
  if (settledNow) { styleSettled(el, 0); el.querySelectorAll('.name span').forEach(x => x.classList.add('on')); el.querySelector('.n').style.opacity = 1; }
  return el;
}
function place(s){ s.el.style.left = (s.x*W) + 'px'; s.el.style.top = (s.y*H - 34) + 'px'; }
function styleSettled(el, dur){
  el.style.transition = dur ? `font-size ${dur}s cubic-bezier(.2,.7,.2,1), letter-spacing ${dur}s cubic-bezier(.2,.7,.2,1), color ${dur}s ease, text-shadow ${dur}s ease` : 'none';
  Object.assign(el.style, { fontSize: '10.5px', letterSpacing: '.14em', color: 'rgba(200,196,214,.62)', textShadow: '0 0 12px rgba(4,5,11,.9)' });
}
function styleArrive(el){
  el.style.transition = 'none';
  Object.assign(el.style, { fontSize: '19px', letterSpacing: '.62em', color: '#fff', textShadow: '0 0 14px rgba(210,225,255,.95), 0 0 42px rgba(160,185,255,.6)' });
}
settled.forEach(s => makeLabel(s, true));
function spawn(s){
  const t0 = performance.now();
  const stars = Array.from({length: s.n}, (_, i) => { const a = i / s.n * 6.28 + rnd(); return { fx: s.x + Math.cos(a)*(.18 + rnd()*.1), fy: s.y + Math.sin(a)*(.14 + rnd()*.08), tx: s.x + Math.cos(a)*.035, ty: s.y + Math.sin(a)*.03 }; });
  const r = { ...s, t0, stars }; live.push(r);
  if (s.el) s.el.remove();
  const el = makeLabel(r, false); styleArrive(el);
  const spans = [...el.querySelectorAll('.name span')], rules = el.querySelectorAll('.rule'), band = el.querySelector('.band');
  const w = el.querySelector('.name').getBoundingClientRect().width;
  const at = (ms, fn) => timers.push(setTimeout(fn, ms / speed));
  spans.forEach((sp, i) => at(700 + i*70, () => sp.classList.add('on')));
  if (carto) at(700, () => { rules.forEach(x => { x.style.opacity = 1; x.style.width = (w + 90) + 'px'; }); band.style.width = (w + 160) + 'px'; band.style.opacity = 1; });
  const settleAt = 700 + spans.length*70 + 1100;
  at(settleAt, () => { styleSettled(el, 1.8 / speed); rules.forEach(x => { x.style.opacity = 0; x.style.width = '0px'; }); band.style.opacity = 0; });
  at(settleAt + 1400, () => el.querySelector('.n').style.opacity = 1);
  return settleAt + 1800;
}
function clearAll(){ timers.forEach(clearTimeout); timers = []; live.forEach(r => r.el && r.el.remove()); live = []; SPAWNS.forEach(s => delete s.el); }
function play(list){
  clearAll();
  if (!queued) list.forEach(s => spawn(s));
  else { let t = 0; list.forEach(s => { timers.push(setTimeout(() => spawn(s), t / speed)); t += 3600; }); }
}
document.getElementById('one').onclick = () => play([SPAWNS[0]]);
document.getElementById('three').onclick = () => play(SPAWNS);
const tog = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); fn(v); }; };
tog('carto', v => carto = v);
tog('queue', v => { queued = v; document.getElementById('queue').textContent = v ? 'Queued' : 'All at once'; });
document.getElementById('speed').onclick = e => { speed = speed === 1 ? .5 : speed === .5 ? 2 : 1; e.target.textContent = `Speed ${speed}×`; };
c.addEventListener('pointerdown', () => { // tap to skip: everything jumps to settled
  timers.forEach(clearTimeout); timers = [];
  live.forEach(r => { r.t0 = -1e9; r.el.querySelectorAll('.name span').forEach(x => x.classList.add('on')); styleSettled(r.el, .4); r.el.querySelectorAll('.rule').forEach(x => { x.style.opacity = 0; x.style.width = '0px'; }); r.el.querySelector('.band').style.opacity = 0; r.el.querySelector('.n').style.opacity = 1; });
});
function frame(now){
  g.fillStyle = '#04050b'; g.fillRect(0, 0, W, H);
  field.forEach(f => { g.fillStyle = `rgba(220,220,255,${f.a * (.75 + .25*Math.sin(now/1000*.6 + f.tw))})`; g.fillRect(f.x*W, f.y*H, f.r, f.r); });
  settled.forEach(s => { blob(s.x*W, s.y*H, s.col, Math.min(W, H)*.22, .9); [[-.03,.01],[.02,-.02],[.01,.03],[-.015,-.025]].forEach(([dx, dy]) => star((s.x+dx)*W, (s.y+dy)*H, 1.6, .85)); place(s); });
  live.forEach(r => {
    const t = (now - r.t0) / 1000 * speed;
    const flare = t < 0 ? 0 : Math.min(1, t / .6) * (1 + 1.6 * Math.exp(-Math.max(0, t - .5) * 1.3)); // bright arrival, then cools to normal
    blob(r.x*W, r.y*H, r.col, Math.min(W, H)*.2*(.6 + .4*ease(Math.min(1, t/2.5))), Math.min(2.4, flare) * .9);
    r.stars.forEach(st => { const k = ease(Math.min(1, Math.max(0, (t - .2) / 2.4))); star((st.fx + (st.tx - st.fx)*k)*W, (st.fy + (st.ty - st.fy)*k)*H, 1.7, .9); });
    place(r);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => play([SPAWNS[0]]), 600);
</script>
</body></html>
